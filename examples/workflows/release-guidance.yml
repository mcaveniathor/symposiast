# Copy to .github/workflows/release-guidance.yml in the crate's repository.
# Set CRATE_NAME below and the ANTHROPIC_API_KEY repository secret.
# Publish the crate to crates.io before publishing its GitHub release.
# This uploads a candidate artifact only. Review that exact artifact before
# publication; see the automation guide's "Review and publish the candidate".
name: Release crate guidance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact published crate version
        required: true
        default: '0.3.0'

permissions:
  contents: read

env:
  CRATE_NAME: stucco

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the provider credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY is required.' >&2; exit 1; }
      - name: Install the analysis agent
        run: npm install --global @anthropic-ai/claude-code@2.1.303
      - name: Build verified crate guidance
        id: guidance
        uses: mcaveniathor/symposiast@action-v1.0.0
        with:
          crate: ${{ env.CRATE_NAME }}
          version: ${{ github.event.release.tag_name || inputs.version }}
          agent: claude-code
          artifact-name: release-guidance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Review before publication
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Candidate guidance ready for review

          Download the `release-guidance` artifact from this run. Inspect its
          evidence, recipes, features, and compilation records, then try it in
          a consumer project. Record human review separately from agent review.

          Publish the reviewed artifact through a registry pull request or a
          revisioned release attachment. Rerunning generation produces a new
          candidate and requires another review.

          [Review and publishing guide](https://mcaveniathor.github.io/symposiast/automation.html#review-and-publish-the-candidate)
          SUMMARY
