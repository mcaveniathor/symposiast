[package]
name = "symposiast"
version = "0.1.0"
edition = "2024"
description = "Release-specific Rust crate guidance for Symposium"
repository = "https://github.com/mcaveniathor/symposiast"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "fs"] }
toml = "0.8"

[dev-dependencies]
