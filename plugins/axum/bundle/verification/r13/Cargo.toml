[dependencies.axum]
default-features = false
features = [
    "tokio",
    "http1",
    "tracing",
]
version = "=0.8.9"

[dependencies.tokio]
default-features = true
features = [
    "macros",
    "rt-multi-thread",
    "net",
]
version = "1.44.2"

[dependencies.tower]
default-features = false
features = [
    "util",
    "limit",
]
version = "0.5.2"

[dependencies.tower-http]
default-features = false
features = ["trace"]
version = "0.6.8"

[dependencies.tracing-subscriber]
default-features = true
features = []
version = "0.3"

[package]
edition = "2024"
name = "recipe-r13"
publish = false
version = "0.0.0"

[workspace]
